bed:
  origin: bottom_left
  y_axis: up
camera:
  mount_height_mm: 360.0
  exposure_us: 20000
  analogue_gain: 1.0
  main_resolution:
  - 1920
  - 1080
  lores_resolution:
  - 640
  - 640
  hfov_deg: 102.0
  distortion_model: pinhole
  auto_distortion: true
  intrinsics_override:
    fx: null
    fy: null
    cx: null
    cy: null
    dist: null
apriltag:
  family: tag36h11
  default_size_mm: 20.0
  default_safe_zone_padding_mm: 5.0
  pdf_page_size: letter
  pdf_page_margin_mm: 10.0
  quad_decimate: 1.0
detection:
  model_path: ~/object-detection-v2/models/detection.hef
  cpu_model_path: ~/object-detection-v2/models/best.pt
  segmentation_model_path: ~/object-detection-v2/models/segmentation.hef
  hailo_fallback_model: /usr/share/hailo-models/yolov8s_h8l.hef
  confidence_threshold: 0.5
  nms_iou_threshold: 0.45
  backend: auto
shapes:
  backend: auto
  fastsam_model_path: ~/object-detection-v2/models/fast_sam_s.hef
  fastsam_fallback_model: /usr/share/hailo-models/fast_sam_s.hef
  min_confidence: 0.35
  classical_fallback_confidence: 0.4
  min_area_mm2: 400.0
  max_area_mm2: 80000.0
  min_solidity: 0.75
  min_extent: 0.35
  circularity_threshold: 0.82
  rounded_rect_circularity_min: 0.65
  bracelet_min_aspect: 6.0
  roi_margin_mm: 5.0
  max_edge_px: 1024
parallax:
  default_object_height_mm: 0.0
calibration:
  max_reprojection_error_mm: 2.0
  scale_refinement_max_iterations: 8
  scale_refinement_tolerance_mm: 0.5
  max_tag_size_error_mm: 1.0
  storage_path: config/calibration.json
dataset:
  storage_path: data/dataset
  train_val_split: 0.8
  classes: []
